# 酷乐光年 token 自动同步 - Quantumult X 重写规则
# 使用方法：在 QX「重写」页面的「引用资源」中添加此文件 URL：
# https://raw.githubusercontent.com/DangoPie/qx-scripts/main/kule.conf
#
# 脚本配置全部通过下面规则 URL 的 hash 参数传入（不写死在脚本里）：
#   panelUrls  多个面板地址，用 | 分隔，按顺序尝试（最近成功的地址自动缓存优先）
#   panelUser  面板用户名
#   panelPass  面板密码
#
# ⚠️ 注意：本仓库是公开的，下面规则里**不包含密码**！
# 你需要把下面这条规则（含 panelPass=你的密码）直接写进 QX 配置文件的 [rewrite_local]，
# 不要使用本公开引用资源。

^https://pw\.gzych\.vip/.* url script-request-header https://raw.githubusercontent.com/DangoPie/qx-scripts/main/kule_token_sync.js#panelUrls=http://你的面板IP:5700&panelUser=你的用户名
